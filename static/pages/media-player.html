<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>智能播放器</title>
  <style>
    :root, html[data-theme="light"] {
      color-scheme: light;
      --accent: #1683ff; --accent-soft: #e9f3ff; --active: #dcecff;
      --window: #f7f9fc; --titlebar: #fbfcfe; --surface: #fff;
      --soft: #f5f7fa; --hover: #edf1f6; --border: #e5eaf1;
      --border-strong: #d8e0ea; --text: #171a20; --sub: #5f6875;
      --muted: #8a94a3; --icon: #45505f;
      --shadow: 0 12px 30px rgba(32,49,72,.15);
      --empty-a: #dfeafb; --empty-b: #8ca8cc;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --accent: #238cff; --accent-soft: rgba(24,128,255,.14); --active: rgba(29,123,224,.25);
      --window: #0b1119; --titlebar: #131d2a; --surface: #111a25;
      --soft: #16202c; --hover: #1c2835; --border: #263443;
      --border-strong: #334354; --text: #f3f6fa; --sub: #b3bdc9;
      --muted: #7f8b9a; --icon: #c1cad5;
      --shadow: 0 16px 36px rgba(0,0,0,.4);
      --empty-a: #1c3045; --empty-b: #080e16;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-width: 720px; overflow: hidden; color: var(--text); background: var(--window);
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    svg {
      width: 18px; height: 18px; display: block; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .titlebar {
      -webkit-app-region: drag; height: 58px; display: flex; align-items: center;
      padding-left: 40px; border-bottom: 1px solid var(--border); background: var(--titlebar);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      position: relative; width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(145deg,#86c5ff,#4d8fff 55%,#5669ee);
      box-shadow: 0 3px 10px rgba(38,125,255,.28);
    }
    .brand-mark::before {
      content: ""; position: absolute; left: 10px; top: 7px;
      border-top: 7px solid transparent; border-bottom: 7px solid transparent;
      border-left: 10px solid #fff;
    }
    .brand-title { font-size: 18px; font-weight: 700; }
    .spacer { flex: 1; }
    .theme-toggle {
      -webkit-app-region: no-drag; height: 34px; display: flex; align-items: center;
      gap: 7px; margin-right: 14px; padding: 0 14px; border: 0; border-radius: 18px;
      color: var(--accent); background: var(--accent-soft); cursor: pointer;
    }
    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle span:last-child { font-size: 13px; font-weight: 600; }
    .window-actions { -webkit-app-region: no-drag; height: 100%; display: flex; }
    .window-btn {
      width: 46px; height: 100%; display: grid; place-items: center; padding: 0;
      border: 0; color: var(--icon); background: transparent; cursor: pointer;
    }
    .window-btn:hover { background: var(--hover); }
    .window-btn.close:hover { color: #fff; background: #e81123; }
    .window-btn svg { width: 16px; height: 16px; }
    .workspace {
      height: calc(100% - 58px); display: grid;
      grid-template-columns: minmax(0,1fr) minmax(310px,370px);
      gap: 16px; padding: 16px 28px 20px;
    }
    .sidebar, .stage {
      min-height: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    }
    .sidebar { display: flex; flex-direction: column; overflow: hidden; order: 2; }
    .sidebar-head {
      height: 58px; flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--border);
    }
    .section-title { font-size: 15px; font-weight: 700; }
    .add-btn, .stage-btn {
      height: 36px; display: inline-flex; align-items: center; justify-content: center;
      gap: 7px; padding: 0 14px; border: 1px solid transparent; border-radius: 7px;
      background: var(--soft); cursor: pointer; white-space: nowrap;
    }
    .add-btn { height: 32px; padding: 0 10px; color: var(--accent); background: var(--accent-soft); }
    .add-btn:hover { color: #fff; background: var(--accent); }
    .add-btn svg { width: 16px; height: 16px; }
    .stage-btn { font-weight: 600; border-color: var(--border); }
    .stage-btn:hover { background: var(--hover); border-color: var(--border-strong); }
    .stage-btn svg { width: 17px; height: 17px; }
    .source-list {
      min-height: 100px; flex: 1; display: flex; flex-direction: column; gap: 9px;
      padding: 10px 12px; overflow: auto;
    }
    .source-item {
      width: 100%; min-height: 60px; display: grid;
      grid-template-columns: 30px minmax(0,1fr) auto 28px; align-items: center;
      gap: 9px; padding: 9px 7px 9px 12px; border: 1px solid var(--border);
      border-left: 2px solid transparent; border-radius: 7px; background: var(--soft);
      cursor: pointer; outline: none;
    }
    .source-item:hover, .source-item:focus-visible { background: var(--hover); }
    .source-item.active {
      border-color: rgba(24,131,255,.2); border-left-color: var(--accent); background: var(--active);
    }
    .source-play {
      width: 26px; height: 26px; display: grid; place-items: center;
      border-radius: 50%; color: var(--muted); background: var(--surface);
    }
    .source-play svg { width: 14px; height: 14px; fill: currentColor; stroke-width: 0; transform: translateX(1px); }
    .source-item.active .source-play { color: #fff; background: var(--accent); }
    .source-copy { min-width: 0; }
    .source-name { overflow: hidden; font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .source-url { margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .type-badge { padding: 3px 6px; border-radius: 4px; color: var(--accent); background: var(--accent-soft); font-size: 11px; font-weight: 650; }
    .more-btn, .info-copy {
      display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px;
      color: var(--icon); background: transparent; cursor: pointer;
    }
    .more-btn { width: 28px; height: 30px; }
    .more-btn:hover, .more-btn.open { background: rgba(127,139,154,.15); }
    .more-btn svg { width: 17px; height: 17px; }
    .empty-list { margin: auto 0; padding: 28px 12px; color: var(--muted); text-align: center; }
    .empty-list svg { width: 28px; height: 28px; margin: 0 auto 9px; }
    .source-info {
      flex: none; margin: 10px 12px 12px; padding: 12px 13px;
      border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface);
    }
    .info-title { margin-bottom: 10px; color: var(--sub); font-size: 12px; font-weight: 650; }
    .info-row { display: grid; grid-template-columns: 62px minmax(0,1fr) 22px; align-items: center; min-height: 26px; }
    .info-label { color: var(--muted); font-size: 12px; }
    .info-value { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .info-copy { width: 22px; height: 22px; color: var(--muted); }
    .info-copy:hover { color: var(--accent); background: var(--accent-soft); }
    .info-copy svg { width: 14px; height: 14px; }
    .stage { min-width: 0; display: flex; flex-direction: column; padding: 10px 18px 18px; overflow: hidden; order: 1; }
    .stage-actions {
      height: 44px; flex: none; display: flex; align-items: flex-start;
      justify-content: flex-end; gap: 10px;
    }
    .player-shell {
      position: relative; min-height: 0; flex: 1; overflow: hidden; border-radius: 8px;
      background: #03070b; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .dplayer { width: 100%; height: 100%; }
    .dplayer-video-wrap .dplayer-video { object-fit: contain; }
    .player-empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.75); background: linear-gradient(150deg,var(--empty-a),var(--empty-b));
    }
    .empty-player-mark {
      width: 70px; height: 70px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.22); border-radius: 50%;
      background: rgba(4,12,21,.2); backdrop-filter: blur(8px);
    }
    .empty-player-mark svg { width: 28px; height: 28px; fill: currentColor; stroke-width: 0; transform: translateX(2px); }
    .context-menu {
      position: fixed; z-index: 200; width: 188px; padding: 7px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow);
    }
    [hidden] { display: none !important; }
    .menu-btn {
      width: 100%; height: 38px; display: flex; align-items: center; gap: 10px;
      padding: 0 10px; border: 0; border-radius: 6px; background: transparent;
      cursor: pointer; text-align: left; white-space: nowrap;
    }
    .menu-btn:hover { background: var(--hover); }
    .menu-btn svg { width: 17px; height: 17px; color: var(--icon); }
    .dialog-backdrop {
      position: fixed; inset: 0; z-index: 300; display: grid; place-items: center;
      padding: 24px; background: rgba(0,0,0,.34); backdrop-filter: blur(3px);
    }
    .dialog {
      width: min(460px,100%); padding: 20px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); box-shadow: var(--shadow);
    }
    .dialog-title { font-size: 16px; font-weight: 700; }
    .url-input {
      width: 100%; height: 40px; margin-top: 16px; padding: 0 12px;
      border: 1px solid var(--border-strong); border-radius: 6px; outline: none;
      color: var(--text); background: var(--soft); user-select: text;
    }
    .url-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dialog-error { min-height: 20px; padding-top: 5px; color: #e5484d; font-size: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .dialog-btn { height: 34px; padding: 0 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--soft); cursor: pointer; }
    .dialog-btn.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
    .toast {
      position: fixed; left: 50%; bottom: 22px; z-index: 400;
      max-width: min(520px,calc(100% - 40px)); padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.16); border-radius: 7px;
      color: #fff; background: #202a36; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transform: translate(-50%,8px);
      transition: opacity .16s, transform .16s;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .toast.error { background: #d43d45; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: minmax(0,1fr) 300px; padding-inline: 14px; }
      .stage { padding-inline: 10px; }
      .stage-btn { width: 36px; padding: 0; }
      .stage-btn span { display: none; }
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="brand"><div class="brand-mark"></div><div class="brand-title">智能播放器</div></div>
    <div class="spacer"></div>
    <button class="theme-toggle" id="btn-theme" type="button" title="切换日间/夜间">
      <span id="theme-icon"></span><span id="theme-label">日间</span>
    </button>
    <div class="window-actions">
      <button class="window-btn" id="btn-min" type="button" title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="window-btn" id="btn-max" type="button" title="最大化"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
      <button class="window-btn close" id="btn-close" type="button" title="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="section-title">资源列表</div>
        <button class="add-btn" id="btn-add" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>添加资源</span></button>
      </div>
      <div class="source-list" id="source-list"></div>
      <section class="source-info">
        <div class="info-title">选中资源信息</div>
        <div class="info-row"><span class="info-label">协议</span><span class="info-value" id="info-protocol">--</span></div>
        <div class="info-row"><span class="info-label">来源</span><span class="info-value" id="info-source">--</span></div>
        <div class="info-row"><span class="info-label">类型</span><span class="info-value" id="info-type">--</span></div>
        <div class="info-row"><span class="info-label">时长</span><span class="info-value" id="info-duration">--:--</span></div>
        <div class="info-row">
          <span class="info-label">Referer</span><span class="info-value" id="info-referer">--</span>
          <button class="info-copy" id="btn-copy" type="button" title="复制视频地址"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button>
        </div>
      </section>
    </aside>
    <section class="stage">
      <div class="stage-actions">
        <button class="stage-btn" id="btn-float" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M13 12h5v4h-5z"/></svg><span>悬浮播放</span></button>
        <button class="stage-btn" id="btn-full" type="button" title="网页全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span>网页全屏</span></button>
      </div>
      <div class="player-shell">
        <div class="dplayer" id="dplayer"></div>
        <div class="player-empty" id="player-empty"><div class="empty-player-mark" title="暂无可播放资源"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
      </div>
    </section>
  </main>
  <div class="context-menu" id="context-menu" hidden>
    <button class="menu-btn" type="button" data-action="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg><span>复制</span></button>
    <button class="menu-btn" type="button" data-action="download"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 20h16"/></svg><span>下载</span></button>
    <button class="menu-btn" type="button" data-action="external"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="14" height="14" rx="2"/><path d="m4 9-2 2 2 2M11 9l5 3-5 3Z"/></svg><span>调用本地播放器播放</span></button>
  </div>
  <div class="dialog-backdrop" id="add-dialog" hidden>
    <form class="dialog" id="add-form">
      <div class="dialog-title">添加视频资源</div>
      <input class="url-input" id="add-url" type="url" autocomplete="off" placeholder="输入 MP4、M3U8 等视频地址"/>
      <div class="dialog-error" id="add-error"></div>
      <div class="dialog-actions">
        <button class="dialog-btn" id="btn-add-cancel" type="button">取消</button>
        <button class="dialog-btn primary" type="submit">添加并播放</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="../vendor/hls.min.js"></script>
  <script src="../vendor/dplayer.min.js"></script>
  <script>
    const {ipcRenderer} = require('electron');
    const icons = {
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>',
      moon: '<svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>',
      play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      more: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>',
      empty: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg>'
    };
    let items = [], activeIndex = 0, menuIndex = -1;
    let dp = null, hls = null, hlsRecoveryAttempts = 0, pageData = {}, toastTimer = null;
    const MAX_HLS_RECOVERY_ATTEMPTS = 2;
    const $ = (id) => document.getElementById(id);
    function mediaType(item) {
      const url = (item && item.url || '').split('?')[0].toLowerCase();
      if (item && item.mediaType) return String(item.mediaType).toLowerCase();
      if (url.endsWith('.m3u8')) return 'hls';
      const ext = url.match(/\.([a-z0-9]+)$/);
      return ext ? ext[1] : 'video';
    }
    function typeLabel(item) {
      const type = mediaType(item);
      return type === 'hls' ? 'm3u8' : type.toUpperCase();
    }
    function sourceName(item, index) {
      if (item.local && item.name) return item.name;
      if (item.name) return item.name;
      return (item.host || ('资源 ' + (index + 1))) + ' - ' + typeLabel(item);
    }
    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds <= 0) return '--:--';
      const total = Math.floor(seconds), hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60), secs = total % 60;
      const pad = (value) => String(value).padStart(2, '0');
      return hours ? pad(hours) + ':' + pad(minutes) + ':' + pad(secs) : pad(minutes) + ':' + pad(secs);
    }
    function refererOf(item) {
      if (!item) return '';
      const headers = item.playbackHeaders || {};
      return item.referrer || item.referer || headers.Referer || headers.referer || pageData.pageUrl || '';
    }
    function hasHeader(headers, name) {
      return Object.keys(headers || {}).some((key) => key.toLowerCase() === name.toLowerCase());
    }
    function downloadHeadersOf(item) {
      const headers = Object.assign({}, item && item.playbackHeaders || {});
      const referrer = refererOf(item);
      if (!hasHeader(headers, 'Referer') && referrer) headers.Referer = referrer;
      if (!hasHeader(headers, 'Origin') && referrer) {
        try { headers.Origin = new URL(referrer).origin; } catch (e) {}
      }
      return headers;
    }
    function setText(id, value) {
      $(id).textContent = value || '--';
      $(id).title = value || '';
    }
    function toast(message, type) {
      const el = $('toast');
      el.textContent = message;
      el.className = 'toast show' + (type === 'error' ? ' error' : '');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.className = 'toast'; }, 2400);
    }
    function destroyPlayer() {
      try { if (hls) hls.destroy(); } catch (e) {}
      try { if (dp) dp.destroy(); } catch (e) {}
      hls = null; dp = null; hlsRecoveryAttempts = 0; $('dplayer').innerHTML = '';
    }
    function attachHls(video, url) {
      const instance = new Hls();
      hls = instance;
      instance.on(Hls.Events.MEDIA_ATTACHED, () => { if (hls === instance) instance.loadSource(url); });
      instance.on(Hls.Events.ERROR, (event, data) => {
        if (hls !== instance || !data || !data.fatal) return;
        if (hlsRecoveryAttempts >= MAX_HLS_RECOVERY_ATTEMPTS) return toast('视频流解码失败，请重新选择资源', 'error');
        hlsRecoveryAttempts += 1;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) instance.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) instance.recoverMediaError();
        else toast('视频流播放失败', 'error');
      });
      instance.attachMedia(video);
    }
    function updateDuration() {
      if (dp && dp.video) setText('info-duration', formatDuration(dp.video.duration));
    }
    function play(index) {
      if (!items[index]) return;
      activeIndex = index;
      const item = items[index];
      $('player-empty').style.display = 'none';
      destroyPlayer();
      const isHls = mediaType(item) === 'hls' || (item.url || '').toLowerCase().includes('.m3u8');
      dp = new DPlayer({
        container: $('dplayer'), autoplay: true, theme: '#1683ff',
        video: {
          url: item.url, type: isHls ? 'customHls' : 'auto',
          customType: {customHls(video) {
            if (window.Hls && Hls.isSupported()) attachHls(video, item.url);
            else video.src = item.url;
          }}
        }
      });
      if (dp.video) {
        dp.video.addEventListener('loadedmetadata', updateDuration);
        dp.video.addEventListener('durationchange', updateDuration);
      }
      // DPlayer 的网页全屏按钮也同步窗口全屏，避免视频和窗口状态分离。
      if (dp.on) {
        dp.on('webfullscreen', () => {
          if (!windowFullscreen) {
            windowFullscreen = true;
            updateFullscreenButton(true);
            ipcRenderer.send('media-player-toggle-fullscreen');
          }
        });
        dp.on('webfullscreen_cancel', () => {
          if (windowFullscreen) {
            windowFullscreen = false;
            updateFullscreenButton(false);
            ipcRenderer.send('media-player-toggle-fullscreen');
          }
        });
      }
      if (dp.play) dp.play();
      renderList(); renderInfo();
    }
    function renderList() {
      const list = $('source-list');
      list.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-list';
        empty.innerHTML = icons.empty + '<div>暂无视频资源</div>';
        list.appendChild(empty);
        return;
      }
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'source-item' + (index === activeIndex ? ' active' : '');
        row.tabIndex = 0; row.setAttribute('role', 'button');
        const playIcon = document.createElement('span');
        playIcon.className = 'source-play'; playIcon.innerHTML = icons.play;
        const copy = document.createElement('div');
        copy.className = 'source-copy';
        const name = document.createElement('div');
        name.className = 'source-name'; name.textContent = sourceName(item, index); name.title = name.textContent;
        const url = document.createElement('div');
        url.className = 'source-url'; url.textContent = item.url || ''; url.title = item.url || '';
        copy.append(name, url);
        const badge = document.createElement('span');
        badge.className = 'type-badge'; badge.textContent = typeLabel(item);
        const more = document.createElement('button');
        more.type = 'button'; more.className = 'more-btn'; more.title = '资源操作'; more.innerHTML = icons.more;
        more.addEventListener('click', (event) => { event.stopPropagation(); openMenu(index, more); });
        row.append(playIcon, copy, badge, more);
        row.addEventListener('click', () => play(index));
        row.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); play(index); }
        });
        list.appendChild(row);
      });
    }
    function renderInfo() {
      const item = items[activeIndex];
      if (!item) {
        ['info-protocol','info-source','info-type','info-referer'].forEach((id) => setText(id, '--'));
        return setText('info-duration', '--:--');
      }
      let protocol = '--';
      try { protocol = new URL(item.url).protocol.replace(':', ''); } catch (e) {}
      setText('info-protocol', protocol);
      setText('info-source', item.host || pageData.title || (item.local ? '本地文件' : '--'));
      setText('info-type', typeLabel(item));
      setText('info-duration', dp && dp.video ? formatDuration(dp.video.duration) : '--:--');
      setText('info-referer', refererOf(item) || '--');
    }
    function closeMenu() {
      $('context-menu').hidden = true; menuIndex = -1;
      document.querySelectorAll('.more-btn.open').forEach((el) => el.classList.remove('open'));
    }
    function openMenu(index, anchor) {
      const menu = $('context-menu'), wasOpen = !menu.hidden && menuIndex === index;
      closeMenu();
      if (wasOpen) return;
      menuIndex = index; anchor.classList.add('open'); menu.hidden = false;
      const rect = anchor.getBoundingClientRect(), menuRect = menu.getBoundingClientRect();
      menu.style.left = Math.min(innerWidth - menuRect.width - 12, rect.right + 8) + 'px';
      menu.style.top = Math.min(innerHeight - menuRect.height - 12, Math.max(12, rect.top - 2)) + 'px';
    }
    function selectedItem(index = activeIndex) { return items[index] || null; }
    function copyItem(index = activeIndex) {
      const item = selectedItem(index);
      if (!item) return toast('请先选择视频资源', 'error');
      ipcRenderer.send('media-player-copy', item.url); toast('视频地址已复制');
    }
    function downloadItem(index = activeIndex) {
      const item = selectedItem(index);
      if (!item) return toast('请先选择视频资源', 'error');
      const isHls = mediaType(item) === 'hls' || (item.url || '').toLowerCase().includes('.m3u8');
      const rawExt = (item.url.split('?')[0].match(/\.([a-z0-9]+)$/i) || [])[1];
      const host = String(item.host || 'video').replace(/[\\/:*?"<>|]/g, '_');
      ipcRenderer.invoke('media-download', {
        url: item.url, mediaType: item.mediaType || (isHls ? 'hls' : 'mp4'),
        headers: downloadHeadersOf(item),
        fileName: host + '-' + Date.now() + '.' + (isHls ? 'mp4' : (rawExt || 'mp4'))
      }).then((result) => {
        if (result && result.ok) toast('已添加下载，请在浏览器下载列表中查看');
        else toast('下载失败：' + ((result && result.message) || '未知错误'), 'error');
      });
    }
    function externalPlay(index = activeIndex) {
      if (!selectedItem(index)) return toast('请先选择视频资源', 'error');
      if (index !== activeIndex) play(index);
      ipcRenderer.send('media-player-external');
    }
    ipcRenderer.on('media-player-data', (event, data) => {
      const previous = selectedItem(), previousUrl = previous && previous.url;
      const manualItems = items.filter((item) => item.manual);
      const incoming = data && Array.isArray(data.items) ? data.items : [];
      pageData = data || {};
      items = incoming.concat(manualItems.filter((manual) => !incoming.some((item) => item.url === manual.url)));
      if (!items.length) {
        activeIndex = 0; destroyPlayer(); $('player-empty').style.display = 'flex';
        renderList(); renderInfo(); return;
      }
      const keep = items.findIndex((item) => item.url === previousUrl);
      if (keep >= 0 && dp) { activeIndex = keep; renderList(); renderInfo(); }
      else play(0);
    });
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      $('theme-icon').innerHTML = theme === 'dark' ? icons.moon : icons.sun;
      $('theme-label').textContent = theme === 'dark' ? '夜间' : '日间';
      try { localStorage.setItem('media-player-theme', theme); } catch (e) {}
    }
    (function initTheme() {
      let theme = 'light';
      try { theme = localStorage.getItem('media-player-theme') || 'light'; } catch (e) {}
      applyTheme(theme);
    })();
    $('btn-theme').addEventListener('click', () => applyTheme(
      document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
    ));
    $('btn-min').addEventListener('click', () => ipcRenderer.send('media-player-minimize'));
    $('btn-max').addEventListener('click', () => ipcRenderer.send('media-player-toggle-maximize'));
    $('btn-close').addEventListener('click', () => ipcRenderer.send('media-player-close'));
    $('btn-copy').addEventListener('click', () => copyItem());
    let windowFullscreen = false;
    function updateFullscreenButton(isFullscreen) {
      const button = $('btn-full');
      const label = button.querySelector('span');
      if (label) label.textContent = isFullscreen ? '退出全屏' : '网页全屏';
      button.title = isFullscreen ? '退出全屏' : '网页全屏';
    }
    $('btn-full').addEventListener('click', () => {
      if (!dp && !windowFullscreen) return toast('请先选择视频资源', 'error');
      const videoFullscreen = Boolean(dp && dp.fullScreen && dp.fullScreen.isFullScreen('web'));
      const next = !(windowFullscreen || videoFullscreen);
      windowFullscreen = next;
      updateFullscreenButton(next);
      if (dp && dp.fullScreen) {
        try {
          if (next && !videoFullscreen) dp.fullScreen.request('web');
          if (!next && videoFullscreen) dp.fullScreen.cancel('web');
        } catch (e) {
          windowFullscreen = !next;
          updateFullscreenButton(windowFullscreen);
          toast('视频全屏失败', 'error');
          return;
        }
      }
      ipcRenderer.send('media-player-toggle-fullscreen');
    });
    ipcRenderer.on('media-player-fullscreen-state', (event, isFullscreen) => {
      windowFullscreen = Boolean(isFullscreen);
      const videoFullscreen = Boolean(dp && dp.fullScreen && dp.fullScreen.isFullScreen('web'));
      if (!windowFullscreen && videoFullscreen && dp && dp.fullScreen) {
        try { dp.fullScreen.cancel('web'); } catch (e) {}
      }
      updateFullscreenButton(windowFullscreen || videoFullscreen);
    });
    $('btn-float').addEventListener('click', async () => {
      if (!dp || !dp.video) return toast('请先选择视频资源', 'error');
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else await dp.video.requestPictureInPicture();
      } catch (e) { toast('悬浮播放失败', 'error'); }
    });
    $('context-menu').addEventListener('click', (event) => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const index = menuIndex; closeMenu();
      if (button.dataset.action === 'copy') copyItem(index);
      if (button.dataset.action === 'download') downloadItem(index);
      if (button.dataset.action === 'external') externalPlay(index);
    });
    $('btn-add').addEventListener('click', () => {
      $('add-dialog').hidden = false; $('add-error').textContent = ''; $('add-url').value = '';
      setTimeout(() => $('add-url').focus(), 0);
    });
    $('btn-add-cancel').addEventListener('click', () => { $('add-dialog').hidden = true; });
    $('add-dialog').addEventListener('mousedown', (event) => {
      if (event.target === $('add-dialog')) $('add-dialog').hidden = true;
    });
    $('add-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const url = $('add-url').value.trim();
      try {
        const parsed = new URL(url);
        if (!['http:','https:','file:'].includes(parsed.protocol)) throw new Error('protocol');
        if (items.some((item) => item.url === url)) throw new Error('duplicate');
        const match = url.split('?')[0].match(/\.([a-z0-9]+)$/i);
        const type = url.toLowerCase().includes('.m3u8') ? 'hls' : (match ? match[1] : 'video');
        items.unshift({url, host: parsed.hostname || '本地文件', mediaType: type, addedAt: Date.now(), manual: true});
        $('add-dialog').hidden = true; play(0);
      } catch (error) {
        $('add-error').textContent = error && error.message === 'duplicate' ? '该资源已经在列表中' : '请输入有效的视频地址';
      }
    });
    document.addEventListener('mousedown', (event) => {
      if (!$('context-menu').contains(event.target) && !event.target.closest('.more-btn')) closeMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { closeMenu(); $('add-dialog').hidden = true; }
    });
    window.addEventListener('resize', closeMenu);
    window.addEventListener('beforeunload', destroyPlayer);
    ipcRenderer.send('media-player-request-data');
  </script>
</body>
</html>
