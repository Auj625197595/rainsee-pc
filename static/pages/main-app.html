<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--startup-bg, #ffffff);
      }
    </style>
    <script>
      (() => {
        try {
          const { ipcRenderer, nativeTheme } = require('electron');
          const settings = ipcRenderer.sendSync('get-settings-sync') || {};
          const themeSource =
            settings.themeAuto === false
              ? settings.theme === 'wexond-dark'
                ? 'dark'
                : 'light'
              : 'system';
          const dark =
            themeSource === 'dark' ||
            (themeSource === 'system' && nativeTheme.shouldUseDarkColors);
          const bg = dark ? '#1c1c1c' : '#ffffff';
          document.documentElement.style.setProperty('--startup-bg', bg);
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>

    <div style="-webkit-app-region: no-drag"></div>

    <!-- prettier-ignore -->
    <script> </script>
  </body>
</html>
