<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>正在迁移数据</title>
    <style>
      /* 数据迁移进度窗:样式全部内联,不依赖任何外部资源(运行在独立 BrowserWindow,
         零外部依赖)。配色随 prefers-color-scheme,与 crash-reporter 覆盖层一致。 */
      :root {
        color-scheme: light dark;
        --primary: #3452ff;
        --primary-soft: rgba(52, 82, 255, 0.16);
        --bg: #ffffff;
        --panel: #f1f3f4;
        --border: #dadce0;
        --text-main: #202124;
        --text-sub: #5f6368;
        --text-mute: #9aa0a6;
        --ok: #1e8e3e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #6e86ff;
          --primary-soft: rgba(110, 134, 255, 0.2);
          --bg: #191c26;
          --panel: #20242f;
          --border: #2e3340;
          --text-main: #e8eaed;
          --text-sub: #9aa6be;
          --text-mute: #6b7488;
          --ok: #81c995;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text-main);
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Microsoft YaHei', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        padding: 28px 28px 24px;
        overflow: hidden;
        user-select: none;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 2.5px solid var(--primary-soft);
        border-top-color: var(--primary);
        animation: spin 0.8s linear infinite;
      }
      .spinner.done {
        animation: none;
        border: none;
        background: var(--ok);
        position: relative;
      }
      .spinner.done::after {
        content: '';
        position: absolute;
        left: 6px;
        top: 2px;
        width: 6px;
        height: 11px;
        border: solid #fff;
        border-width: 0 2.5px 2.5px 0;
        transform: rotate(45deg);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 12.5px;
        color: var(--text-sub);
        margin: 0 0 18px 34px;
        line-height: 1.5;
        word-break: break-all;
      }
      .progress-wrap {
        height: 8px;
        background: var(--panel);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 10px;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: var(--primary);
        border-radius: 999px;
        transition: width 0.18s ease;
      }
      .progress-bar.done {
        background: var(--ok);
      }
      .meta-row {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        color: var(--text-mute);
        font-variant-numeric: tabular-nums;
      }
      .file-name {
        margin-top: 14px;
        font-size: 12px;
        color: var(--text-sub);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: 'SF Mono', 'Roboto Mono', Consolas, monospace;
        min-height: 16px;
      }
      .note {
        margin-top: 18px;
        font-size: 11.5px;
        color: var(--text-mute);
        line-height: 1.6;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="title-row">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">正在迁移数据…</h1>
    </div>
    <p class="subtitle" id="subtitle">请勿关闭窗口,迁移完成后浏览器将自动启动。</p>

    <div class="progress-wrap">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="meta-row">
      <span id="percent">0%</span>
      <span id="bytes">— / —</span>
    </div>
    <div class="file-name" id="file"></div>

    <div class="note" id="note">迁移仅复制数据,原目录将被保留。</div>

    <script>
      (function () {
        var electron = require('electron');
        var ipc = electron.ipcRenderer;

        var bar = document.getElementById('bar');
        var percentEl = document.getElementById('percent');
        var bytesEl = document.getElementById('bytes');
        var fileEl = document.getElementById('file');
        var titleEl = document.getElementById('title');
        var spinnerEl = document.getElementById('spinner');
        var subtitleEl = document.getElementById('subtitle');
        var noteEl = document.getElementById('note');

        function fmtBytes(n) {
          if (typeof n !== 'number' || n <= 0) return '0 B';
          if (n < 1024) return n + ' B';
          if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
          if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
          return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        ipc.on('migration-meta', function (_e, data) {
          if (!data) return;
          if (data.to) {
            subtitleEl.textContent =
              '目标位置:' + data.to + '\n请勿关闭窗口,迁移完成后浏览器将自动启动。';
          }
          if (typeof data.totalBytes === 'number' && data.totalBytes > 0) {
            bytesEl.textContent = '0 / ' + fmtBytes(data.totalBytes);
          } else {
            // 总量未知(空目录):走不定进度态。
            bytesEl.textContent = '统计中…';
          }
        });

        ipc.on('migration-progress', function (_e, data) {
          if (!data) return;
          var copied = data.copied || 0;
          var total = data.total || 0;
          if (total > 0) {
            var pct = Math.min(100, Math.floor((copied / total) * 100));
            bar.style.width = pct + '%';
            percentEl.textContent = pct + '%';
            bytesEl.textContent = fmtBytes(copied) + ' / ' + fmtBytes(total);
          } else {
            // 无总量:让进度条在 0~90% 间脉动。
            bar.style.width = '40%';
            percentEl.textContent = '复制中…';
            bytesEl.textContent = fmtBytes(copied);
          }
          if (data.file) {
            fileEl.textContent = data.file;
          }
        });

        ipc.on('migration-done', function () {
          bar.style.width = '100%';
          bar.classList.add('done');
          spinnerEl.classList.add('done');
          percentEl.textContent = '100%';
          titleEl.textContent = '迁移完成,正在启动…';
          subtitleEl.textContent = '即将打开浏览器。';
          fileEl.textContent = '';
          noteEl.textContent = '';
        });
      })();
    </script>
  </body>
</html>
